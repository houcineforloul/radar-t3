name: Actualiser les annonces

on:
  schedule:
    - cron: "7 */6 * * *"   # toutes les 6 h (00:07, 06:07, 12:07, 18:07 UTC), hors des minutes rondes surchargées chez GitHub
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Paris          # date du relevé à l'heure française
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Relevé précédent (publié sur Pages) : sert à repérer les nouvelles annonces. Absent = pas de « NEW ».
      - run: curl -fsSL "https://houcineforloul.github.io/radar-t3/annonces.csv" -o annonces.csv || rm -f annonces.csv

      # Si tous les sites échouent, le script s'arrête en erreur : la page déjà en ligne est conservée.
      - run: python scraper.py

      - name: Préparer le site
        run: |
          mkdir site
          cp annonces.html site/index.html
          cp annonces.csv site/annonces.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: scraper
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
